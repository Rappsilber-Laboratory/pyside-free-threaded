name: Build macOS Wheels

on:
  push:
    branches:
      - feature/free-threaded
  pull_request:
    branches:
      - feature/free-threaded
  workflow_dispatch:

jobs:
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          python-feature: 'free-threaded'
          allow-prereleases: true

      - name: Verify Free-Threaded
        run: |
          python -c "import sys; print(f'GIL enabled: {sys._is_gil_enabled()}')"

      - name: Setup Ninja and LLVM
        run: |
          brew install ninja cmake llvm@16 libxml2 libxslt
          echo "LLVM_INSTALL_DIR=$(brew --prefix llvm@16)" >> $GITHUB_ENV
          # Ensure CMake finds the Homebrew versions of keg-only dependencies
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm@16):$(brew --prefix libxml2):$(brew --prefix libxslt):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.1'

      - name: Build PySide6
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CXXFLAGS: "-DQT_NO_CAST_FROM_ASCII -DQT_USE_QSTRINGBUILDER=0"
          CFLAGS: "-DQT_NO_CAST_FROM_ASCII -DQT_USE_QSTRINGBUILDER=0"
          EXTRA_CXXFLAGS: "-DQT_NO_CAST_FROM_ASCII -DQT_USE_QSTRINGBUILDER=0"
          EXTRA_CFLAGS: "-DQT_NO_CAST_FROM_ASCII -DQT_USE_QSTRINGBUILDER=0"
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel build packaging
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-coin.txt
          
          # Build shiboken6_generator first or rely on standalone build
          # We use --no-unity to avoid complex template deduction errors in unity builds
          python setup.py build \
            --standalone \
            --parallel=8 \
            --limited-api=no \
            --macos-arch="x86_64;arm64" \
            --no-unity \
            --extra-config="-DQT_USE_QSTRINGBUILDER=OFF" \
            --log-level=verbose

      - name: Create Wheels
        run: |
          source venv/bin/activate
          python create_wheels.py --no-examples

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: pyside6-wheels-macos-3.13-ft
          path: dist/*.whl
